<h1>The Toolbox</h1>
<p>Practical tools for everyday privacy and debugging. Enable JavaScript to use the interactive tools.</p>
<ul>
<li>Link Lab: clean tracking parameters, inspect URLs, or explicitly create a public short link through is.gd.</li>
<li>Checksum Studio: calculate SHA-256 for text or a local file.</li>
<li>Photo Privacy Studio: re-export, resize, and compress images without original embedded metadata.</li>
<li>File Identity Inspector: compare known file signatures with filename extensions. This is not a malware scan.</li>
<li>Unicode Lens: reveal invisible characters and selected mixed scripts. This is not a complete confusable-character detector.</li>
</ul>
<p>All processing stays in your browser except requested URL shortening. <a href="https://kaushalrajgupta.is-a.dev/">Back to the portfolio</a>.</p>
